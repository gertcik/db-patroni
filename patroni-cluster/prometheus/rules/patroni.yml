groups:
  - name: patroni
    rules:
      - alert: PatroniMasterDown
        expr: max(patroni_primary) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "No master in Patroni cluster"

      - alert: PatroniNodeDown
        expr: sum(up{job="patroni"}) < 3
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Patroni node is down"

      - alert: ReplicationLagHigh
        expr: pg_stat_replication_pg_wal_lsn_diff{application_name!="PostgreSQL JDBC Driver"} > 52428800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Replication lag exceeds 50 MB on {{ $labels.application_name }}"

      # В бэкенде patroni_back только лидер проходит чек GET /master (200),
      # реплики всегда DOWN — норма. Срабатываем, когда UP нет ни у кого.
      - alert: HAProxyBackendDown
        expr: sum(haproxy_server_status{proxy="patroni_back",state="UP"}) == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "HAProxy has no UP server in patroni_back (leader unreachable)"

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count{state="active"} > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Active connections above 80 on {{ $labels.instance }}"
