groups:
  - name: patroni
    rules:
      - alert: PatroniMasterDown
        expr: patroni_master == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "No master in Patroni cluster"

      - alert: PatroniNodeDown
        expr: sum(up{job="patroni"}) < 3
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Patroni node is down"

      - alert: ReplicationLagHigh
        expr: patroni_lag > 52428800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Replication lag exceeds 50 MB"

      - alert: HAProxyBackendDown
        expr: haproxy_server_up{backend="patroni_back"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "HAProxy backend {{ $labels.server }} is DOWN"

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count{state="active"} > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Active connections above 80 on {{ $labels.instance }}"
