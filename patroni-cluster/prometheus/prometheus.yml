global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: patroni
    static_configs:
      - targets:
          - patroni1:8008
          - patroni2:8008
          - patroni3:8008
    metrics_path: /metrics

  - job_name: postgresql
    static_configs:
      - targets:
          - pg-exporter-patroni1:9187
          - pg-exporter-patroni2:9187
          - pg-exporter-patroni3:9187
          - pg-exporter-physical:9187
          - pg-exporter-logical:9187
          - pg-exporter-audit:9187

  - job_name: haproxy
    static_configs:
      - targets:
          - haproxy:8405
    metrics_path: /metrics

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
