# ═══════════════════════════════════════════════════════════════
# HAProxy — единая точка входа для Patroni-кластера
# - Порт 5432 (TCP): клиентские подключения к мастеру
# - Порт 7000 (HTTP): статистика и health check
# Health-check: GET /master на порт 8008 Patroni REST API
#   - 200 → узел является лидером → трафик направляется на него
#   - Любой другой код → узел не лидер → исключается из пула
# failover прозрачен для клиентов
# ═══════════════════════════════════════════════════════════════
global
  maxconn 100

defaults
  log global
  mode tcp                    # Режим TCP (прокси PostgreSQL)
  timeout connect 3000ms      # Таймаут подключения к бэкенду
  timeout client 3600000ms    # Максимальное время idle для клиента (1 час)
  timeout server 3600000ms    # То же для сервера (долгие SQL-запросы)

# ─── Фронтенд для PostgreSQL ───
frontend patroni_front
  bind *:5432
  default_backend patroni_back

# ─── Фронтенд статистики ───
frontend stats
  bind *:7000
  mode http
  stats enable
  stats uri /
  stats refresh 10s

# ─── Prometheus metrics ───
frontend prometheus
  bind *:8405
  mode http
  http-request use-service prometheus-exporter if { path /metrics }

# ─── Бэкенд: Patroni-кластер ───
backend patroni_back
  # HTTP health-check: Patroni REST API возвращает 200 на /master,
  # если этот узел — текущий лидер, иначе 503
  option httpchk GET /master
  http-check expect status 200
  server patroni1 patroni1:5432 check port 8008 inter 5s fall 3 rise 2
  server patroni2 patroni2:5432 check port 8008 inter 5s fall 3 rise 2
  server patroni3 patroni3:5432 check port 8008 inter 5s fall 3 rise 2
